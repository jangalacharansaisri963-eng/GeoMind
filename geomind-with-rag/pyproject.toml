[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomind-ai"
version = "0.1.0"
description = "An intelligent Python-based AI focused on Geography, History, and Social Studies with an interactive CLI and extensible reasoning engine."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
keywords = [
    "geography",
    "history",
    "social-studies",
    "ai",
    "cli",
    "education",
    "haversine",
    "distance",
    "civilizations",
    "nlp",
    "reasoning"
]
authors = [
    {name = "GeoMind AI Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = []

[project.optional-dependencies]
cli = ["rich>=12.0.0"]
research = ["playwright>=1.40.0"]
rag = [
    "sentence-transformers>=2.2.0; python_version>='3.9'",
    "fastembed>=0.2.0; python_version>='3.9'",
]
full = [
    "rich>=12.0.0",
    "playwright>=1.40.0",
    "sentence-transformers>=2.2.0; python_version>='3.9'",
]
test = ["pytest>=7.0.0"]

[project.scripts]
geomind = "geomind.cli:main"

[project.urls]
Homepage = "https://github.com/geomind-ai/geomind"
Repository = "https://github.com/geomind-ai/geomind"
Documentation = "https://github.com/geomind-ai/geomind#readme"
"Bug Tracker" = "https://github.com/geomind-ai/geomind/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geomind*"]
